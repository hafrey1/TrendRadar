name: Auto Check-In

on:
  schedule:
    # 每 5 天执行一次（避免超过 7 天失效）
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  auto-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Check-In Workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ⚠️ 这里写你的文件名
            const workflow_id = "clean-crawler.yml";

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "master"
            });

            console.log("✅ Auto Check-In Success");
